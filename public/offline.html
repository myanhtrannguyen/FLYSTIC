<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#20a064" />
    <title>FLYSTIC — Bạn đang ngoại tuyến</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7fdf7;
        color: #153b26;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      p {
        line-height: 1.6;
        color: #52705e;
      }
      button {
        border: 0;
        border-radius: 0.75rem;
        background: #20a064;
        color: #fff;
        padding: 0.8rem 1.2rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>FLYSTIC đang cần kết nối mạng</h1>
      <p>Hãy kiểm tra Internet rồi tải lại để xem trạm thu gom và xác nhận giao dịch QR.</p>
      <button onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
